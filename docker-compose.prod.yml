version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bome_postgres_prod
    environment:
      POSTGRES_DB: bome
      POSTGRES_USER: bome_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bome_user -d bome"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bome_internal

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: bome_backend_prod
    environment:
      # Digital Ocean will provide PORT automatically
      PORT: ${PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bome
      DB_USER: bome_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: disable
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 24h
      JWT_REFRESH_EXPIRY: 168h
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      BUNNY_API_KEY: ${BUNNY_API_KEY}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_PULL_ZONE: ${BUNNY_PULL_ZONE}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY}
      BUNNY_REGION: ${BUNNY_REGION:-de}
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-nyc3.digitaloceanspaces.com}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@bookofmormonevidence.org}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Book of Mormon Evidences}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bookofmormonevidence.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-100MB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-9090}
      HEALTH_CHECK_ENDPOINT: ${HEALTH_CHECK_ENDPOINT:-/health}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bome_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  bome_internal:
    driver: bridge
    internal: true  # No external access
