version: '3.8'

services:
  # Main application
  bome-frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://backend:8080/api/v1}
    volumes:
      - search-index-data:/app/static
    depends_on:
      - search-index-generator

  # Nightly search index generator
  search-index-generator:
    build:
      context: .
      dockerfile: Dockerfile.search-index
    environment:
      - API_URL=${API_URL:-http://backend:8080/api/v1}
      - SEARCH_INDEX_SCHEDULE=${SEARCH_INDEX_SCHEDULE:-0 0 * * *}
      - TZ=${TIMEZONE:-America/Denver}
      - SEARCH_INDEX_OUTPUT=/shared/search-index.json
    volumes:
      - search-index-data:/shared
    restart: unless-stopped
    command: ["node", "scripts/nightly-search-index.js", "start"]

volumes:
  search-index-data:
